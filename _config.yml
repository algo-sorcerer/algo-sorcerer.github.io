# AlgoSorcerer World — Jekyll Configuration for GitHub Pages
title: "AlgoSorcerer World"
tagline: "System Design, Algorithms & Interactive Labs"
description: "Interactive browser simulations, OpenSearch system architecture deep dives, and engineer-to-engineer breakdowns by Alex & Sam."
url: "https://algo-sorcerer.github.io"
baseurl: ""

# Author & Branding
author:
  name: "AlgoSorcerer"
  handle: "@AlgoSorcerer"
  email: "creator@algosorcerer.com"
  avatar: "/assets/brand/channel_icon.png"
  banner: "/assets/brand/channel_banner.png"
  watermark: "/assets/brand/watermark.png"
  youtube_url: "https://www.youtube.com/@AlgoSorcerer"
  github_url: "https://github.com/algo-sorcerer"

# Characters / Podcast Hosts
characters:
  acharya:
    name: "Alex (ex. Acharya)"
    title: "Distributed Systems & Search Lead"
    avatar: "/assets/brand/acharya_avatar.svg"
    symbol: "🔍"
    voice: "en-US-AndrewMultilingualNeural"
  anvay:
    name: "Sam (ex. Anvay)"
    title: "Backend & Infrastructure Engineer"
    avatar: "/assets/brand/anvay_avatar.svg"
    symbol: "⚡"
    voice: "en-US-BrianMultilingualNeural"

# Sass / SCSS Configuration
sass:
  sass_dir: _sass
  style: compressed

# Markdown & Syntax
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Excludes
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .venv
