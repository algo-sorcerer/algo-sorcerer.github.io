# AlgoSorcerer World — Jekyll Configuration for GitHub Pages
title: "AlgoSorcerer World"
tagline: "High-Performance Computer Science & Algorithmic Mental Models"
description: "Interactive browser simulations, algorithmic mental models, and dual-voice dialogues between Senior Architect Acharya and Junior Engineer Anvay on high-performance Computer Science and system architecture."
url: "https://algo-sorcerer.github.io"
baseurl: ""

# Author & Branding
author:
  name: "AlgoSorcerer"
  handle: "@AlgoSorcerer"
  email: "creator@algosorcerer.com"
  avatar: "/assets/brand/logo.svg"
  watermark: "/assets/brand/watermark.png"
  youtube_url: "https://www.youtube.com/@AlgoSorcerer"
  github_url: "https://github.com/algo-sorcerer"

# Characters
characters:
  acharya:
    name: "Acharya Vidyadhar"
    title: "Senior CS Architect & Mentor"
    avatar: "/assets/brand/acharya_avatar.svg"
    symbol: "🎓"
    voice: "en-IN-PrabhatNeural"
  anvay:
    name: "Anvay"
    title: "Junior Software Engineer & Student"
    avatar: "/assets/brand/anvay_avatar.svg"
    symbol: "💡"
    voice: "en-IN-NeerjaNeural"

# Sass / SCSS Configuration
sass:
  sass_dir: _sass
  style: compressed

# Markdown & Syntax
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Excludes
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .venv
