- id: "load_balancing"
  num: "01"
  title: "Traffic Distribution & Load Balancing"
  category: "Edge & Routing"
  concept: "Consistent Hashing & Round Robin"
  mental_model: "The Equilibrium of Streams"
  hook: "How do distributed gateways distribute 10 million concurrent requests without crushing any single replica?"
  summary: "A single monolithic server bottleneck is an architectural failure. Load balancers distribute incoming TCP/HTTP packets across dynamic worker pools using Consistent Hashing rings, preventing cache stampedes during node membership changes."
  key_metrics: "P99 < 15ms • Zero Dropped Connections"
  architectural_rule: "Never let single nodes bear unbound load; decouple traffic ingestion from execution via hashing rings."

- id: "caching_locality"
  num: "02"
  title: "Caching & Temporal Locality"
  category: "Performance"
  concept: "LRU/LFU Eviction & Cache-Aside Pattern"
  mental_model: "The Memory of the Present"
  hook: "Why hit disk storage when 95% of read queries touch the exact same 5% of hot data?"
  summary: "Disk I/O and relational queries introduce milliseconds of latency. In-memory stores like Redis and Memcached sit directly before databases, leveraging Temporal and Spatial Locality to serve sub-millisecond responses."
  key_metrics: "Sub-millisecond Read • 98.4% Cache Hit Ratio"
  architectural_rule: "Cache read-heavy hot partitions, but always establish deterministic TTLs and eviction policies to prevent stale state."

- id: "db_indexing"
  num: "03"
  title: "Database Indexing & Storage Engines"
  category: "Storage"
  concept: "B+ Trees vs LSM-Trees"
  mental_model: "The Cartographer's Index"
  hook: "Why does an unindexed query perform an agonizing O(N) table scan across petabytes?"
  summary: "Relational engines organize rows into balanced B+ Tree structures, guaranteeing logarithmic O(log N) disk page lookups. Write-intensive engines utilize Log-Structured Merge (LSM) trees with append-only write logs and memtable flushing."
  key_metrics: "Logarithmic O(log N) Page Traversals"
  architectural_rule: "Index columns selectively; each secondary index accelerates reads at the direct expense of write throughput."

- id: "distributed_consensus"
  num: "04"
  title: "Distributed Consensus & Leader Election"
  category: "Consensus"
  concept: "Raft Algorithm & Quorum Commits"
  mental_model: "The Council of Agreeing Peers"
  hook: "When network partitions tear a cluster in half, which side has the authority to write state?"
  summary: "In asynchronous distributed systems, network partitions (split-brain) are inevitable. Consensus algorithms like Raft elect a single leader via heartbeats and randomized election timers, committing state only when a majority quorum approves."
  key_metrics: "Quorum = floor(N/2) + 1 • Zero Split-Brain"
  architectural_rule: "In network partitions, prioritize either Consistency or Availability (CAP theorem); never pretend both can be maximized simultaneously."

- id: "message_queues"
  num: "05"
  title: "Message Queues & Event Streaming"
  category: "Asynchronous Pipelines"
  concept: "Kafka Partitions, Topics & Backpressure"
  mental_model: "The Reservoir and the Flume"
  hook: "What happens when an upstream traffic surge produces events 10x faster than downstream workers can process?"
  summary: "Synchronous HTTP calls couple services tightly in time and availability. Append-only distributed message logs (Kafka) buffer bursts, decouple publishers from consumers, and provide deterministic backpressure."
  key_metrics: "Millions of Events/Sec • Linear Horizontal Partitioning"
  architectural_rule: "Decouple synchronous inter-service calls with durable event queues to isolate failure domains."

- id: "fault_tolerance"
  num: "06"
  title: "Resilience, Circuit Breakers & Retries"
  category: "Reliability"
  concept: "Circuit Breakers, Exponential Backoff & Jitter"
  mental_model: "The Safety Valve"
  hook: "How does a minor downstream timeout trigger a cascading failure that crashes an entire cloud region?"
  summary: "When a downstream service degrades, naive retry storms flood the struggling resource with traffic. Circuit Breakers detect elevated error rates, instantly tripping to an open state and returning fallbacks to allow downstream recovery."
  key_metrics: "Cascading Failures Prevented • Graceful Degradation"
  architectural_rule: "Always wrap remote RPCs in circuit breakers and exponential backoff with randomized jitter."
