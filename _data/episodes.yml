- id: "recursion_samsara"
  num: "01"
  title: "Recursion & Samsara: The Cosmic Call Stack"
  sanskrit_title: "संसार चक्र एवं प्रत्यावर्तनम्"
  cs_concept: "Recursion & Base Cases"
  vedic_philosophy: "Samsara & Moksha"
  school: "Advaita Vedanta"
  icon: "🌀"
  equation: "T(n) = T(n-1) + O(1)"
  hook: "Why does a recursive function without a base case crash your computer, exactly like a soul cycling endlessly through rebirth?"
  core: "Recursion is a function calling itself with a smaller problem. Samsara is the soul cycling through rebirth until spiritual ignorance is exhausted. Without a Base Case, the call stack overflows into memory exhaustion—the Base Case that halts the stack is Moksha."
  shloka: "पुनरपि जननं पुनरपि मरणं पुनरपि जननीजठरे शयनम्"
  shloka_meaning: "Born again, dying again, resting in a mother's womb again—break the cycle."

- id: "binary_search_neti"
  num: "02"
  title: "Binary Search & Neti-Neti: Eliminating Maya"
  sanskrit_title: "नेति नेति एवं द्वि-अन्वेषणम्"
  cs_concept: "Binary Search & Divide-and-Conquer"
  vedic_philosophy: "Neti-Neti (Not this, not this)"
  school: "Upanishads"
  icon: "🎯"
  equation: "T(n) = T(n/2) + O(1)"
  hook: "Ancient rishis found the ultimate truth in O(log N) time—using the exact same logic as Binary Search!"
  core: "In the Brihadaranyaka Upanishad, the seeker seeks Brahman not by affirming what it is, but by systematically eliminating what it is not: 'Neti, Neti'. Binary Search discards half the search space at every step until truth shines."
  shloka: "नेति नेति इति आत्मा, अगृह्यो न हि गृह्यते"
  shloka_meaning: "The Self is 'Not this, not that'; ungraspable by sensory illusions."

- id: "indras_net_graphs"
  num: "03"
  title: "Indra's Net & Graph Theory: The Cosmic Lattice"
  sanskrit_title: "इन्द्रजाल एवं जाल-सिद्धान्तः"
  cs_concept: "Graph Theory & PageRank"
  vedic_philosophy: "Indra's Net (Indrajala)"
  school: "Avatamsaka Sutra"
  icon: "🕸️"
  equation: "PR(u) = \\sum PR(v)/L(v)"
  hook: "Thousands of years before Google created PageRank, Vedic sages described reality as an infinite web of reflective jewels."
  core: "In Indra's Net, infinite jewels hang at every vertex of a cosmic web. In each jewel, all other jewels are reflected. In Graph Theory, a node's true centrality is defined by the reflections of all other nodes."
  shloka: "सर्वं खल्विदं ब्रह्म"
  shloka_meaning: "All this universe is indeed one interconnected consciousness."

- id: "aparigraha_gc"
  num: "04"
  title: "Garbage Collection & Aparigraha: Reclaiming the Heap"
  sanskrit_title: "अपरिग्रह एवं स्मृति-शोधनम्"
  cs_concept: "Garbage Collection & Memory Leaks"
  vedic_philosophy: "Aparigraha (Non-Possessiveness)"
  school: "Patanjali Yoga"
  icon: "🧹"
  equation: "Heap_{free} = Heap_{total} - LiveRefs"
  hook: "Ever wonder why your mind feels slow and exhausted? You are suffering from an uncollected memory leak!"
  core: "A memory leak happens when an object is no longer useful, yet dangling pointers still prevent it from being freed. Patanjali's Yoga Sutras prescribe 'Aparigraha'—run your mental Mark-and-Sweep to free heap memory."
  shloka: "अपरिग्रहस्थैर्ये जन्मकथंतासंबोधः"
  shloka_meaning: "When non-attachment is firmly established, supreme mental clarity dawns."

- id: "dynamic_programming_karma"
  num: "05"
  title: "Dynamic Programming & Sanchita Karma: Memoization"
  sanskrit_title: "संचित कर्म एवं स्मृत्याधारित कलनविधिः"
  cs_concept: "Dynamic Programming & Memoization"
  vedic_philosophy: "Sanchita Karma (Stored Lessons)"
  school: "Karma Yoga"
  icon: "📿"
  equation: "O(2^n) \\to O(n)"
  hook: "Why suffer the same life mistakes twice? Dynamic programming is simply conscious karma memoization!"
  core: "Brute-force recursion recalculates identical subproblems in exponential O(2^N) agony. Dynamic Programming stores solutions in a lookup cache. Remembering past karmic lessons converts exponential suffering into linear peace."
  shloka: "कर्मण्येवाधिकारस्ते मा फलेषु कदाचन"
  shloka_meaning: "Act consciously with wisdom, not enslaved by repetitive subproblems."

- id: "three_gunas_sorting"
  num: "06"
  title: "The Three Gunas & Sorting: From Chaos to Sattva"
  sanskrit_title: "त्रिगुण एवं क्रमबद्धीकरणम्"
  cs_concept: "Sorting Algorithms & Entropy"
  vedic_philosophy: "The Three Gunas (Sattva, Rajas, Tamas)"
  school: "Samkhya Darshana"
  icon: "⚖️"
  equation: "H(X) = -\\sum P(x) \\log P(x)"
  hook: "Every unsorted array in code is pure Tamas—and QuickSort is the fire of Rajas bringing forth Sattva!"
  core: "An unsorted dataset is Tamas (inert disorder). The algorithm applies Rajasic comparison and swap operations around a pivot until the whole system settles into balanced, harmonious Sattva."
  shloka: "सत्त्वं रजस्तम इति गुणाः प्रकृतिसंभवाः"
  shloka_meaning: "Sattva, Rajas, and Tamas—these three qualities govern material nature."
