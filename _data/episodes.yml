- id: "recursion_samsara"
  num: "01"
  title: "Recursion & Call Stacks: Halting Conditions"
  sub_concept: "Call Stack Mechanics & Stack Overflows"
  cs_concept: "Recursion & Boundary Conditions"
  mental_model: "Halting Invariants & Loop Termination"
  school: "Computational Logic"
  icon: "🌀"
  equation: "T(n) = T(n-1) + O(1)"
  hook: "Why does a recursive function without a base case crash your server with a Stack Overflow?"
  core: "Recursion is a computational function invoking itself with a smaller subproblem. Without an explicit Base Case (halting boundary), every invocation allocates a new stack frame onto limited memory until the call stack overflows. In system architecture, clear boundary conditions prevent runaway infinite loops."
  axiom: "Base Case Invariant"
  axiom_meaning: "Define the exit boundary before executing recursive state expansion."

- id: "binary_search_neti"
  num: "02"
  title: "Binary Search: Divide-and-Conquer Pruning"
  sub_concept: "Logarithmic Search & Space Reduction"
  cs_concept: "Binary Search & Divide-and-Conquer"
  mental_model: "Systematic Pruning & Exclusion"
  school: "Algorithm Optimization"
  icon: "🎯"
  equation: "T(n) = T(n/2) + O(1)"
  hook: "How does Binary Search pinpoint a single element among a billion items in just thirty iterations?"
  core: "Linear search through unsorted data scales poorly in O(N). By sorting the search space and evaluating the midpoint, Binary Search discards fifty percent of candidate elements at each step—achieving lightning O(log N) efficiency."
  axiom: "Logarithmic Pruning"
  axiom_meaning: "Halving the search space repeatedly reduces massive problem sets to constant steps."

- id: "indras_net_graphs"
  num: "03"
  title: "Graph Theory & DAGs: Distributed Topologies"
  sub_concept: "Directed Acyclic Graphs & PageRank"
  cs_concept: "Graph Theory, DAGs & PageRank"
  mental_model: "Network Reflexivity & Dependency Graphs"
  school: "Systems Architecture"
  icon: "🕸️"
  equation: "PR(u) = \\sum PR(v)/L(v)"
  hook: "Why is a microservice or node never truly independent in a distributed architecture?"
  core: "Graph Theory structures complex networks into vertices connected by directed edges. In distributed microservices, dependency graphs, and PageRank, an isolated node has zero utility—its reliability and performance are governed by its network topology."
  axiom: "Topological Interdependence"
  axiom_meaning: "Individual component performance is determined by structural network topology."

- id: "aparigraha_gc"
  num: "04"
  title: "Garbage Collection: Reclaiming Dead Heap"
  sub_concept: "Mark-and-Sweep & Leak Prevention"
  cs_concept: "Garbage Collection & Memory Management"
  mental_model: "Releasing Dangling References"
  school: "Resource Optimization"
  icon: "🧹"
  equation: "Heap_{free} = Heap_{total} - LiveRefs"
  hook: "Ever wonder why long-running software slows down and crashes? You are holding onto dead references!"
  core: "A memory leak occurs when an object is no longer functionally required, yet dangling pointers prevent the runtime garbage collector from reclaiming heap memory. Severing dead references keeps systems lean and throughput high."
  axiom: "Zero-Leak Invariant"
  axiom_meaning: "Release dormant references immediately to guarantee sustained runtime memory."

- id: "dynamic_programming_karma"
  num: "05"
  title: "Dynamic Programming: Caching Past Computation"
  sub_concept: "Memoization & State Lookups"
  cs_concept: "Dynamic Programming & Memoization"
  mental_model: "Subproblem Caching & State Reuse"
  school: "Complexity Optimization"
  icon: "📿"
  equation: "O(2^n) \\to O(n)"
  hook: "Why does naive recursion run in exponential O(2^N) time, recalculating identical subproblems in agony?"
  core: "Naive recursive algorithms re-evaluate identical subproblems repeatedly at exponential cost. Dynamic Programming introduces memoization lookup tables: calculate each distinct subproblem once, store the result, and retrieve it in O(1) constant time."
  axiom: "State Caching Principle"
  axiom_meaning: "Cache prior computation to convert exponential explosion into linear execution."

- id: "three_gunas_sorting"
  num: "06"
  title: "Sorting & Information Entropy: Chaos to Order"
  sub_concept: "QuickSort Partitioning & Shannon Entropy"
  cs_concept: "QuickSort, MergeSort & Shannon Entropy"
  mental_model: "Partitioning & Entropy Dissipation"
  school: "Information Dynamics"
  icon: "⚖️"
  equation: "H(X) = -\\sum P(x) \\log_2 P(x)"
  hook: "An unsorted array holds maximum entropy. How does QuickSort bring deterministic order out of chaos?"
  core: "In computer science, an unsorted array embodies high disorder and entropy. QuickSort designates a pivot element, applies active partitioning swaps, and recursively settles sub-arrays until the collection achieves minimal entropy and sorted equilibrium."
  axiom: "Partitioning Invariant"
  axiom_meaning: "Deterministic comparison and partitioning eliminate entropy into ordered stability."
