- id: "recursion_samsara"
  num: "01"
  chapter: "Chapter I"
  title: "Recursion & Call Stacks"
  sub_concept: "Halting Invariants & Finite Termination"
  cs_concept: "Recursion & Call Stacks"
  mental_model: "The Expanding Spiral of State"
  school: "Computational Logic"
  icon: "🌀"
  equation: "T(n) = T(n-1) + O(1)"
  time_complexity: "O(N)"
  space_complexity: "O(N) Stack Frames"
  lab_id: "recursion_samsara"
  hook: "Why does an algorithm eat its own memory when it forgets when to stop?"
  core: "Recursion breaks complex problems into self-similar subproblems. Without an explicit Base Case (halting boundary), each recursive invocation pushes a new stack frame onto finite memory until the process terminates in a stack overflow. In architecture, clear boundary conditions prevent runaway runaway state."
  metaphor: "A hall of mirrors that continues infinitely until a solid frame halts the reflection."
  connector_to_next: "When recursive exploration becomes linear and exhaustive, how do we prune complexity? Through Divide-and-Conquer."

- id: "binary_search_neti"
  num: "02"
  chapter: "Chapter II"
  title: "Binary Search & Pruning"
  sub_concept: "Logarithmic Search & Space Elimination"
  cs_concept: "Binary Search & Divide-and-Conquer"
  mental_model: "Systematic Pruning & Exclusion"
  school: "Algorithm Optimization"
  icon: "🎯"
  equation: "T(n) = T(n/2) + O(1)"
  time_complexity: "O(log N)"
  space_complexity: "O(1)"
  lab_id: "binary_search_neti"
  hook: "How does an algorithm isolate a single value among a billion records in thirty operations?"
  core: "Linear search checks every single element sequentially in O(N). By sorting the search space and evaluating the midpoint, Binary Search discards fifty percent of candidate elements at every step—achieving logarithmic O(log N) clarity while others search linearly."
  metaphor: "A master sculptor carving stone by systematically chipping away what the sculpture is not."
  connector_to_next: "Isolated elements are simple, but what happens when elements form interconnected networks of dependency? We enter Graph Theory."

- id: "indras_net_graphs"
  num: "03"
  chapter: "Chapter III"
  title: "Graph Theory & Distributed Topologies"
  sub_concept: "Directed Acyclic Graphs (DAGs) & Centrality"
  cs_concept: "Graph Theory, DAGs & PageRank"
  mental_model: "Network Reflexivity & Topology"
  school: "Systems Architecture"
  icon: "🕸️"
  equation: "PR(u) = \\sum PR(v)/L(v)"
  time_complexity: "O(V + E)"
  space_complexity: "O(V)"
  lab_id: "indras_net_graphs"
  hook: "Why is an isolated service never truly independent in a modern distributed cloud?"
  core: "Graph Theory models complex systems as vertices connected by directed edges. In microservices, dependency graphs, and PageRank, an isolated node has zero utility—its reliability and performance are defined entirely by its structural network topology."
  metaphor: "An interconnected cosmic lattice where every node's vibration is felt across the entire network."
  connector_to_next: "As graphs grow in memory, dormant nodes and unreferenced objects accumulate. How do we reclaim wasted space? Garbage Collection."

- id: "aparigraha_gc"
  num: "04"
  chapter: "Chapter IV"
  title: "Garbage Collection & Memory Reclamation"
  sub_concept: "Mark-and-Sweep & Leak Prevention"
  cs_concept: "Garbage Collection & Memory Models"
  mental_model: "Releasing Dormant References"
  school: "Resource Optimization"
  icon: "🧹"
  equation: "Heap_{free} = Heap_{total} - LiveRefs"
  time_complexity: "O(Live + Dead)"
  space_complexity: "O(Heap)"
  lab_id: "aparigraha_gc"
  hook: "Ever wonder why long-running software slows down and crashes? You are holding onto dead references!"
  core: "A memory leak occurs when an object is no longer functionally required, yet lingering pointers prevent the runtime garbage collector from reclaiming heap memory. Severing dead references keeps systems lean and throughput high."
  metaphor: "Clearing out stagnant archives so that active thoughts can flow unimpeded."
  connector_to_next: "Reclaiming memory allows us to store valuable state. But what if we could cache past computation to prevent redundant work? Dynamic Programming."

- id: "dynamic_programming_karma"
  num: "05"
  chapter: "Chapter V"
  title: "Dynamic Programming & Memoization"
  sub_concept: "Overlapping Subproblems & State Caching"
  cs_concept: "Dynamic Programming & Memoization"
  mental_model: "Subproblem Caching & State Reuse"
  school: "Complexity Optimization"
  icon: "📿"
  equation: "O(2^n) \\to O(n)"
  time_complexity: "O(N)"
  space_complexity: "O(N) Memo Table"
  lab_id: "dynamic_programming_karma"
  hook: "Why recalculate identical subproblems thousands of times in exponential agony?"
  core: "Naive recursive algorithms re-evaluate identical subproblems repeatedly at exponential O(2^N) cost. Dynamic Programming establishes memoization lookup tables: calculate each distinct subproblem once, store the result, and retrieve it in O(1) constant time."
  metaphor: "A traveler keeping a faithful journal so they never make the same costly detour twice."
  connector_to_next: "When data is processed and cached, it must be ordered and indexed for retrieval. How do we organize disorder? Sorting Algorithms."

- id: "three_gunas_sorting"
  num: "06"
  chapter: "Chapter VI"
  title: "Sorting & Information Entropy"
  sub_concept: "Partitioning Swaps & Equilibrium"
  cs_concept: "QuickSort, MergeSort & Shannon Entropy"
  mental_model: "Partitioning & Entropy Dissipation"
  school: "Information Dynamics"
  icon: "⚖️"
  equation: "H(X) = -\\sum P(x) \\log_2 P(x)"
  time_complexity: "O(N \\log N)"
  space_complexity: "O(\\log N)"
  lab_id: "three_gunas_sorting"
  hook: "An unsorted array holds maximum entropy. How does QuickSort bring deterministic order out of chaos?"
  core: "In computer science, an unsorted array contains maximum disorder and Shannon entropy. QuickSort designates a pivot element, applies active partitioning swaps, and recursively settles sub-arrays until the collection achieves minimal entropy and sorted equilibrium."
  metaphor: "Turbulent waters coming to stillness through rhythmic, deliberate settling."
  connector_to_next: "From basic sorting to distributed scale, these six mental models form the bedrock of System Design and Architecture."
