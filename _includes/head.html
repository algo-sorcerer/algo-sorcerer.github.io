<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }} — {{ site.tagline }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/brand/logo.svg' | relative_url }}">

<!-- Open Graph / Meta -->
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:site_name" content="AlgoSorcerer World">
<meta property="og:image" content="{{ '/assets/brand/logo.svg' | absolute_url }}">
<meta name="theme-color" content="#08090D">

<!-- Umami Cloud Analytics -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="d09fc9aa-a50b-409d-8c6e-df574557ce32"></script>

<!-- Google Fonts: Editorial Serif (Cinzel, Playfair Display), Modern Sans (Outfit), Monospace (Fira Code) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800;900&family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
