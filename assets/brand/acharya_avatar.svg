<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="acharyaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0c1b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="mentorRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="120" cy="120" r="115" fill="url(#acharyaAura)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Subtle Algorithmic Logic Grid Ring -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,6" opacity="0.4"/>

  <!-- Senior Scholar / Architect Robe -->
  <path d="M 40 220 Q 80 160, 120 165 Q 160 160, 200 220 Z" fill="url(#mentorRobe)"/>
  <path d="M 120 165 L 120 220" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  <path d="M 75 190 Q 120 215, 165 190" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>

  <!-- Neck -->
  <rect x="108" y="132" width="24" height="22" rx="4" fill="#fed7aa"/>

  <!-- Head -->
  <ellipse cx="120" cy="98" rx="28" ry="32" fill="#fed7aa"/>

  <!-- Mature, Dignified Hair (Professor / Tech Mentor) -->
  <path d="M 92 90 C 90 60, 150 60, 148 90 C 144 72, 96 72, 92 90 Z" fill="#475569"/>
  <path d="M 90 92 Q 120 68, 150 92 Q 130 76, 110 78 Z" fill="#64748b"/>

  <!-- Trim Modern Silver/Grey Beard -->
  <path d="M 98 108 Q 120 148, 142 108 Q 134 135, 120 140 Q 106 135, 98 108 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- Thoughtful Eyes -->
  <circle cx="111" cy="98" r="3" fill="#1e293b"/>
  <circle cx="129" cy="98" r="3" fill="#1e293b"/>

  <!-- Sleek Modern Glasses (Academic / Architect) -->
  <rect x="102" y="90" width="16" height="14" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <rect x="122" y="90" width="16" height="14" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <line x1="118" y1="96" x2="122" y2="96" stroke="#f59e0b" stroke-width="2"/>

  <!-- Subtle Algorithmic Glyphs on Collar -->
  <text x="120" y="185" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#06b6d4" text-anchor="middle">&lt;algorithm&gt;</text>

  <rect x="35" y="212" width="170" height="24" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="228" font-family="'Cinzel', 'Outfit', sans-serif" font-size="10.5" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="2">ACHARYA • ARCHITECT</text>
</svg>
