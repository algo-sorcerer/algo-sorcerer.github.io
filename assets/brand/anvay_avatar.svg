<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="anvayAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0e1726" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="studentHoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="120" cy="120" r="115" fill="url(#anvayAura)" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Developer Hoodie / Attire -->
  <path d="M 45 220 Q 80 162, 120 168 Q 160 162, 195 220 Z" fill="url(#studentHoodie)"/>
  <path d="M 90 195 L 120 170 L 150 195" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>

  <!-- Neck -->
  <rect x="110" y="132" width="20" height="22" rx="4" fill="#fed7aa"/>

  <!-- Head -->
  <ellipse cx="120" cy="100" rx="26" ry="30" fill="#fed7aa"/>

  <!-- Modern Short Styled Hair -->
  <path d="M 94 92 C 92 68, 148 68, 146 92 C 140 76, 100 76, 94 92 Z" fill="#1e293b"/>
  <path d="M 94 88 Q 120 70, 146 88 Q 130 76, 110 78 Z" fill="#334155"/>

  <!-- Bright Inquisitive Eyes -->
  <ellipse cx="110" cy="98" rx="3.5" ry="4" fill="#0f172a"/>
  <circle cx="111" cy="96.5" r="1.2" fill="#ffffff"/>
  <ellipse cx="130" cy="98" rx="3.5" ry="4" fill="#0f172a"/>
  <circle cx="131" cy="96.5" r="1.2" fill="#ffffff"/>

  <!-- Light Dev Headset / Earphones -->
  <path d="M 92 98 Q 120 62, 148 98" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <rect x="88" y="94" width="7" height="14" rx="3" fill="#06b6d4"/>
  <rect x="145" y="94" width="7" height="14" rx="3" fill="#06b6d4"/>

  <!-- Smiling, Ready to Learn -->
  <path d="M 115 114 Q 120 118, 125 114" fill="none" stroke="#9a3412" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Floating Code Terminal Prompt -->
  <rect x="156" y="60" width="46" height="24" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
  <text x="179" y="76" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">&gt; _run</text>

  <!-- Tag / Name Badge -->
  <rect x="45" y="212" width="150" height="24" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="120" y="228" font-family="'Cinzel', 'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">ANVAY • DEV</text>
</svg>
