  <circle cx="101" cy="95" r="5" fill="#1e293b"/>
  <circle cx="103" cy="92.5" r="2" fill="#ffffff"/>
  <path d="M 89 91 Q 85 88, 82 84" fill="none" stroke="#090d16" stroke-width="2.6" stroke-linecap="round"/>

  <ellipse cx="141" cy="95" rx="8.5" ry="9.5" fill="#ffffff" stroke="#090d16" stroke-width="2.5"/>
  <circle cx="143" cy="95" r="5" fill="#1e293b"/>
  <circle cx="145" cy="92.5" r="2" fill="#ffffff"/>
  <path d="M 151 91 Q 155 88, 158 84" fill="none" stroke="#090d16" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Nose & Warm Confident Smile -->
  <path d="M 120 98 Q 124 109, 118 111" fill="none" stroke="#b47549" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 108 124 Q 120 133, 132 124" fill="none" stroke="#9d174d" stroke-width="3" stroke-linecap="round"/>

  <!-- Mic Boom -->
  <path d="M 64 106 Q 82 126, 102 124" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <circle cx="104" cy="124" r="4" fill="#f472b6" stroke="#090d16" stroke-width="1.5"/>

  <!-- Foreground Compact Laptop Silhouette at bottom center like Sam -->
  <path d="M 64 256 L 76 218 L 164 218 L 176 256 Z" fill="#334155" stroke="#090d16" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="120" cy="238" r="6" fill="none" stroke="#f472b6" stroke-width="2"/>
  <circle cx="120" cy="238" r="2" fill="#f472b6"/>
</svg>
