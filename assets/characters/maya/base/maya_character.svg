  <path d="M 68 88 C 64 26, 176 24, 172 88 C 150 56, 122 54, 96 68 C 80 76, 72 82, 68 88 Z" fill="url(#mayaLocks)" stroke="#090d16" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 88 56 Q 120 42, 152 62" fill="none" stroke="#f472b6" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>

  <!-- Expressive Eyebrows -->
  <path d="M 88 78 Q 98 72, 108 77" fill="none" stroke="#090d16" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 132 77 Q 142 72, 152 78" fill="none" stroke="#090d16" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Large Stylized Expressive Eyes + Lashes -->
