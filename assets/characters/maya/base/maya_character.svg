<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 14 200 246" width="200" height="246">
  <defs>
    <radialGradient id="mayaBustGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mayaHoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="60%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mayaLocks" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Subtle Aura Behind Head -->
  <circle cx="120" cy="108" r="102" fill="url(#mayaBustGlow)"/>

  <!-- Flowing Back Hair Behind Shoulders -->
  <path d="M 66 86 C 46 132, 46 198, 68 232 Q 92 214, 98 175 L 142 175 Q 148 214, 172 232 C 194 198, 194 132, 174 86 Z" fill="url(#mayaLocks)" stroke="#090d16" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 60 132 Q 55 174, 72 212" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.4"/>
  <path d="M 180 132 Q 185 174, 168 212" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.4"/>

  <!-- Jacket / Hoodie Bust -->
  <path d="M 28 258 C 36 188, 76 164, 120 166 C 164 164, 204 188, 212 258 Z" fill="url(#mayaHoodie)" stroke="#090d16" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M 88 170 L 120 218 L 152 170" fill="#1e1b4b" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Hoodie collar strings -->
  <line x1="106" y1="196" x2="106" y2="230" stroke="#f9a8d4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="134" y1="196" x2="134" y2="230" stroke="#f9a8d4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neck & Collarbone -->
  <rect x="103" y="132" width="34" height="38" rx="10" fill="#e0a374" stroke="#090d16" stroke-width="3.5"/>

  <!-- Rose-Pearl Earrings -->
  <circle cx="71" cy="112" r="4.5" fill="#f472b6" stroke="#090d16" stroke-width="2"/>
  <circle cx="169" cy="112" r="4.5" fill="#f472b6" stroke="#090d16" stroke-width="2"/>

  <!-- Head & Jawline -->
  <path d="M 120 30 C 162 30, 174 62, 170 98 C 168 128, 146 150, 120 152 C 94 150, 72 128, 70 98 C 66 62, 78 30, 120 30 Z" fill="#f5c69c" stroke="#090d16" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Sleek Studio Headphones -->
  <path d="M 65 92 C 66 28, 174 28, 175 92" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 65 92 C 66 28, 174 28, 175 92" fill="none" stroke="#f472b6" stroke-width="2.2" opacity="0.7" stroke-linecap="round"/>
  <rect x="57" y="76" width="14" height="32" rx="7" fill="#0f172a" stroke="#f472b6" stroke-width="3"/>
  <rect x="169" y="76" width="14" height="32" rx="7" fill="#0f172a" stroke="#f472b6" stroke-width="3"/>

